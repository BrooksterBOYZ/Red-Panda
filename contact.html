<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Velvet Panda Sanctuary — book a visit, donate to reforestation, or get in touch with our team.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <title>Velvet | Contact Us</title>
    <style>
        .text-gradient {
            background: linear-gradient(to right, #10b981, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
    </style>
</head>

<body class="bg-slate-50 font-sans">
    <nav class="glass-nav py-5">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <a href="index.html" class="text-3xl font-black text-gradient">VELVET🦊</a>

            <div class="hidden md:flex gap-8 font-medium text-slate-600">
                <a href="index.html" class="hover:text-emerald-600 transition">Home</a>
                <a href="park.html" class="hover:text-emerald-600 transition">The Park</a>
                <a href="cafe.html" class="hover:text-emerald-600 transition">Café</a>
                <a href="about.html" class="hover:text-emerald-600 transition">About</a>
                <a href="contact.html" class="text-emerald-600">Contact</a>
            </div>

            <button class="md:hidden" id="mobile-menu-btn">☰</button>
        </div>
    </nav>

    <section class="py-20 px-6 max-w-7xl mx-auto">
        <div class="grid lg:grid-cols-2 gap-16 items-center">

            <div data-aos="fade-right">
                <span class="bg-emerald-100 text-emerald-700 px-4 py-1 rounded-full text-sm font-bold uppercase tracking-wider">Contact</span>
                <h1 class="text-6xl md:text-7xl font-black mb-8 mt-4 text-slate-900">
                    Get In <span class="text-gradient">Touch.</span>
                </h1>
                <p class="text-xl text-slate-500 mb-10 leading-relaxed">
                    Planning a visit or have a question? Our team typically responds within one business day.
                </p>

                <div class="space-y-6">
                    <div class="flex items-center gap-4 text-lg font-bold text-slate-700">
                        <span class="text-2xl">📍</span> 220 Panda Road, Leander, TX
                    </div>
                    <div class="flex items-center gap-4 text-lg font-bold text-slate-700">
                        <span class="text-2xl">📞</span> +1 (512) 555-7777
                    </div>
                </div>
            </div>

            <div class="bg-white p-8 md:p-10 rounded-[2.5rem] shadow-2xl shadow-emerald-900/5 border border-slate-100" data-aos="fade-left">
                <form id="velvet-contact-form" class="space-y-5">
                    <input type="text" name="name" placeholder="Full Name" required 
                        class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-emerald-500/20 outline-none transition">

                    <input type="email" name="email" placeholder="Email Address" required 
                        class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-emerald-500/20 outline-none transition">

                    <select name="type" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none transition">
                        <option value="" disabled selected>Inquiry Type</option>
                        <option value="visit">Plan a Visit</option>
                        <option value="group">Group Booking</option>
                        <option value="other">Other</option>
                    </select>

                    <textarea name="message" rows="4" placeholder="Your message..." required 
                        class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none transition"></textarea>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-[0.98]">
                        Send Inquiry
                    </button>
                </form>
            </div>
        </div>
    </section>

    <footer class="py-10 text-center text-slate-400 text-sm">
        <p>© 2026 Velvet Sanctuary. All rights reserved.</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        // VERCEL SUCCESS HANDLER
        const contactForm = document.getElementById('velvet-contact-form');
        
        contactForm.addEventListener('submit', function(e) {
            e.preventDefault(); // Stop the "POST" that causes the white screen
            
            // In a real Vercel app, you would fetch() an API route here.
            // For now, we simulate a successful send and redirect:
            
            console.log("Form submitted!");
            window.location.href = "thank-you.html";
        });
    </script>
</body>
</html>
