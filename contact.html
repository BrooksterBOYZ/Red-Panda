<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Velvet Panda Sanctuary">
    
    <!-- ✅ FIXED CSS PATH -->
    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <title>Velvet | Contact Us</title>
</head>

<body>

<nav class="glass-nav py-5">
    <div class="page-container flex justify-between items-center">
        <a href="index.html" class="text-3xl font-black text-gradient">VELVET🦊</a>

        <div class="hidden md:flex gap-8">
            <a href="index.html" class="nav-link">Home</a>
            <a href="park.html" class="nav-link">The Park</a>
            <a href="cafe.html" class="nav-link">Café</a>
            <a href="conservation.html" class="nav-link">Care</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="contact.html" class="nav-link active-link">Contact</a>
        </div>
    </div>
</nav>

<section class="hero-section page-container">

<div class="grid lg:grid-cols-2 gap-20 w-full">

    <!-- LEFT -->
    <div>
        <span class="badge mb-6">We'd Love to Hear From You</span>

        <h1 class="text-6xl md:text-7xl font-black mb-8 mt-4">
            Get In <span class="text-gradient">Touch.</span>
        </h1>

        <p class="text-xl text-slate-500 mb-12">
            We respond within one business day.
        </p>
    </div>

    <!-- FORM -->
    <div class="bento-card bg-white">

        <form name="contact"
              method="POST"
              data-netlify="true"
              netlify-honeypot="bot-field"
              action="thank-you.html"
              class="space-y-5">

            <input type="hidden" name="form-name" value="contact">

            <p style="display:none">
                <label>Bot: <input name="bot-field"></label>
            </p>

            <input type="text" name="name" placeholder="Full Name" required>

            <input type="email" name="email" placeholder="Email Address" required>

            <select name="type">
                <option disabled selected>Inquiry Type</option>
                <option>Visit</option>
                <option>Donate</option>
                <option>Press</option>
            </select>

            <textarea name="message" rows="5" placeholder="Message..." required></textarea>

            <button type="submit" class="btn-main w-full">
                Send Inquiry
            </button>

        </form>

    </div>

</div>

</section>

</body>
</html>
