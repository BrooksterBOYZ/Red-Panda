<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Contact Us | Velvet Panda</title>
</head>
<body>
    <nav class="glass-nav py-4">
        <div class="page-container flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black text-gradient">VELVET🦊</a>
            <div class="hidden md:flex gap-6 font-bold text-sm uppercase tracking-widest">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="contact.html" class="text-red-500">Contact</a>
            </div>
        </div>
    </nav>

    <main class="hero-padding page-container">
        <div class="grid md:grid-cols-2 gap-16">
            <div>
                <h1 class="text-6xl font-black mb-6">Reach Out.</h1>
                <p class="text-slate-500 mb-8">Have questions about our stay options or conservation efforts? Our team is here to help.</p>
                <div class="space-y-6">
                    <div class="bento-card py-6">
                        <p class="font-bold">📍 Location</p>
                        <p class="text-slate-500">Highlands Peak, Sector 7, Himalayan Reserve</p>
                    </div>
                    <div class="bento-card py-6">
                        <p class="font-bold">📞 Phone</p>
                        <p class="text-slate-500">+1 (800) VELVET-PANDA</p>
                    </div>
                </div>
            </div>
            <div class="bento-card">
                <form action="#" method="POST" class="space-y-4">
                    <div>
                        <label class="font-bold text-sm">Full Name</label>
                        <input type="text" required placeholder="Your name">
                    </div>
                    <div>
                        <label class="font-bold text-sm">Email Address</label>
                        <input type="email" required placeholder="email@example.com">
                    </div>
                    <div>
                        <label class="font-bold text-sm">How can we help?</label>
                        <textarea rows="4" placeholder="Your message..."></textarea>
                    </div>
                    <button type="submit" class="btn-primary w-full py-4 mt-4">Send Message</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
